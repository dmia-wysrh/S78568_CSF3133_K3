<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact Us & Interactive Calculator</title>
</head>
<body>

    <!-- 1. Header Section -->
    <div id="header">
        <h1>Campus Connect <span style="font-size: 0.6em; font-weight: normal;">&ndash; Reach Out &amp; Calculate</span></h1>
    </div>

    <!-- 2. Content Section (Contains Contact Form and Inline Calculator) -->
    <div id="content">
        
        <!-- Contact Form Sub-section -->
        <div id="contact-form">
            <h2>Contact Form</h2>
            <form>
                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required autofocus><br><br>

                <label for="contact-date">Preferred Contact Date:</label>
                <input type="date" id="contact-date" name="contact_date"><br><br>

                <label for="satisfaction">Satisfaction Level:</label>
                <input type="range" id="satisfaction" name="satisfaction" min="1" max="5" value="3"><br><br>

                <input type="submit" value="Submit Inquiry">
            </form>
        </div>

        <hr>

        <!-- Inline Calculator Sub-section -->
        <div id="calculator">
            <h2>Inline Calculator</h2>
            <form oninput="result.value = Number(num1.value) + Number(num2.value)">
                <label for="num1">Number 1:</label>
                <input type="number" id="num1" name="num1" value="0"><br><br>

                <label for="num2">Number 2:</label>
                <input type="number" id="num2" name="num2" value="0"><br><br>

                <label>Sum: </label>
                <output name="result" for="num1 num2">0</output>
            </form>
        </div>

    </div>

    <!-- 3. Footer Section -->
    <div id="footer">
        <p>&copy; 2026 Campus Connect. All rights reserved. &nbsp;|&nbsp; Contact: support@campusconnect.edu</p>
    </div>

</body>
</html>
